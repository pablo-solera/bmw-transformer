# Disposable services for `bun run test:e2e`. Ports are different from every other compose file on purpose.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${E2E_SA_PASSWORD:?Set by scripts/run-e2e-tests.ts}
    ports:
      - "127.0.0.1:21433:1433"

  redis:
    image: redis:8.10.2-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  rustfs-permissions:
    image: alpine:3.23.3
    user: root
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
    command: ["sh", "-c", "chown -R 10001:10001 /data/rustfs0 /data/rustfs1 /data/rustfs2 /data/rustfs3"]

  rustfs:
    image: rustfs/rustfs:1.0.1
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:29000:9000"
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: e2etestaccess
      RUSTFS_SECRET_KEY: e2etestsecret-only-for-local-tests
      RUSTFS_OBS_LOGGER_LEVEL: warn
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs-data-0:/data/rustfs0
      - rustfs-data-1:/data/rustfs1
      - rustfs-data-2:/data/rustfs2
      - rustfs-data-3:/data/rustfs3
    healthcheck:
      test: ["CMD", "sh", "-ec", "curl -fsS http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 15s

volumes:
  rustfs-data-0:
  rustfs-data-1:
  rustfs-data-2:
  rustfs-data-3:
